name: rusi_trader_ai
description: AI Powered Trading Platform

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  go_router: ^14.3.0

  dio: ^5.7.0

  web_socket_channel: ^3.0.1

  flutter_animate: ^4.5.0

  intl: ^0.19.0

  google_fonts: ^6.2.1

  syncfusion_flutter_charts: ^27.1.50

  fl_chart: ^0.69.0

  shared_preferences: ^2.3.2

  flutter_svg: ^2.0.10+1

  shimmer: ^3.0.0

  lottie: ^3.1.2

  connectivity_plus: ^6.0.5

  package_info_plus: ^8.0.2

  device_info_plus: ^10.1.2

  crypto: ^3.0.5

  uuid: ^4.5.1

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:

    - assets/images/

    - assets/icons/

    - assets/logo/

    - assets/animation/

  fonts:

    - family: Inter

